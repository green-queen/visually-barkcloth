<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" type="text/css" href="styles/site.css">
  <title>Visually Barkcloth</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body>
  <nav class="nav">
    <ul>
      <li><a href="index.php">Home</a></li>
      <li><a href="quiz.html">Quiz</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <main class="page">
    <div id="quiz-container"></div>
    <div id="img-modal"
      style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.7); justify-content:center; align-items:center; z-index:9999; cursor:pointer;">
      <img id="modal-img" src="" style="max-width:90vw; max-height:90vh;">
    </div>
  </main>

  <script>
    const QUESTIONS = [
      {
        type: 'multiple',
        text: 'What building blocks do you see?',
        options: ['Cross']
      },
      {
        type: 'text',
        text: 'What pattern rhythm do you see?'
      },
      {
        type: 'text',
        text: 'What is the first thing you think of when you see this textile?'
      },
      {
        type: 'text',
        text: 'What pattern do you see?'
      }
    ];

    function parseCSV(text) {
      const lines = text.trim().split('\n');
      const headers = splitCSVLine(lines[0]);
      return lines.slice(1).map(line => {
        const values = splitCSVLine(line);
        return Object.fromEntries(headers.map((h, i) => [h, values[i]?.trim() ?? '']));
      });
    }

    function splitCSVLine(line) {
      const result = [];
      let cur = '', inQuotes = false;
      for (const ch of line) {
        if (ch === '"') { inQuotes = !inQuotes; }
        else if (ch === ',' && !inQuotes) { result.push(cur); cur = ''; }
        else { cur += ch; }
      }
      result.push(cur);
      return result;
    }

    function pickRandom(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function getImageLink(barkcloth) {
      return `img/${barkcloth.id}.png`;
    }

    function buildAnswerHTML(question) {
      if (question.type === 'multiple') {
        const dropdowns = [
          {
            id: "square-dropdown",
            label: "Select Square",
            options: [
              { value: "square", text: "Square" },
              { value: "rectangle", text: "Rectangle" },
              { value: "rhombus", text: "Rhombus" }
            ]
          },
          {
            id: "circle-dropdown",
            label: "Select Circle",
            options: [
              { value: "circle", text: "Circle" },
              { value: "oval", text: "Oval" },
              { value: "dot", text: "Dot" }
            ]
          },
          {
            id: "triangle-dropdown",
            label: "Select Triangle",
            options: [
              { value: "equilateral", text: "Equilateral" },
              { value: "right", text: "Right" },
              { value: "isosceles", text: "Isosceles" },
              { value: "scalene", text: "Scalene" }
            ]
          },
          {
            id: "lines-dropdown",
            label: "Select Line",
            options: [
              { value: "regular", text: "Regular" },
              { value: "dotted", text: "Dotted" },
              { value: "curved", text: "Curved" }
            ]
          }
        ];

        const dropdownHTML = dropdowns.map(drop =>
          `<div class="dropdown" data-control="checkbox-dropdown" id="${drop.id}">
            <label class="dropdown-label">${drop.label}</label>
            <div class="dropdown-list">
              ${drop.options.map(opt => `
                <label class="dropdown-option">
                  <input type="checkbox" name="dropdown-group" value="${opt.value}" /> ${opt.text}
                </label>
              `).join('')}
            </div>
          </div>`
        ).join('');

        const optionsHTML = question.options.map(opt => `
          <label class="quiz-option">
            <input type="checkbox" name="answer" value="${opt}"> ${opt}
          </label>
        `).join('');

        return dropdownHTML + optionsHTML + `
        <label class="quiz-struct">
          Other structures you see:
          <textarea class="quiz-textarea"
            name="answer"
            rows="4"
            placeholder="Your answer..."></textarea>
        </label>
        `;
      }

      return `
        <textarea class="quiz-textarea"
          name="answer"
          rows="4"
          placeholder="Your answer..."></textarea>
      `;
    }

    let barkcloth, question;

    function showQuiz(data) {
      const container = document.getElementById('quiz-container');
      barkcloth = pickRandom(data);
      question = pickRandom(QUESTIONS);

      container.innerHTML = `
        <img class="quiz-img" src="${getImageLink(barkcloth)}" alt="${barkcloth.id}">
        <div class="quiz-citation">
          ${barkcloth["reference citation"]}
        </div>
        <form id="quiz-form">
          <div class="quiz-question">${question.text}</div>
          ${buildAnswerHTML(question)}
          <button class="quiz-submit" type="submit">Submit</button>
        </form>
      `;

      const quizImg = container.querySelector('.quiz-img');
      const imgModal = document.getElementById('img-modal');
      const modalImg = document.getElementById('modal-img');

      quizImg.onclick = function () {
        modalImg.src = quizImg.src;
        imgModal.style.display = 'flex';
      };

      imgModal.onclick = function () {
        imgModal.style.display = 'none';
      };

      if (document.querySelector('[data-control="checkbox-dropdown"]')) {
        (function ($) {
          var CheckboxDropdown = function (el) {
            var _this = this;
            this.isOpen = false;
            this.$el = $(el);
            this.$label = this.$el.find('.dropdown-label');
            this.$inputs = this.$el.find('[type="checkbox"]');
            this.$label.on('click', function (e) {
              e.preventDefault();
              _this.toggleOpen();
            });
          };
          CheckboxDropdown.prototype.toggleOpen = function (forceOpen) {
            var _this = this;
            if (!this.isOpen || forceOpen) {
              this.isOpen = true;
              this.$el.addClass('on');
              $(document).on('click', function (e) {
                if (!$(e.target).closest('[data-control]').length) {
                  _this.toggleOpen();
                }
              });
            } else {
              this.isOpen = false;
              this.$el.removeClass('on');
              $(document).off('click');
            }
          };
          var checkboxesDropdowns = document.querySelectorAll('[data-control="checkbox-dropdown"]');
          for (var i = 0, length = checkboxesDropdowns.length; i < length; i++) {
            new CheckboxDropdown(checkboxesDropdowns[i]);
          }
        })(jQuery);
      }

      document.getElementById('quiz-form')
        .addEventListener('submit', async (e) => {
          e.preventDefault();

          const form = e.target;
          const submitBtn = form.querySelector('.quiz-submit');

          function getChecked(dropdownId) {
            return Array.from(
              document.querySelectorAll(`#${dropdownId} input[type="checkbox"]:checked`)
            ).map(cb => cb.value).join(', ');
          }

          const crossChecked = Array.from(
            form.querySelectorAll('input[name="answer"][type="checkbox"]:checked')
          ).map(cb => cb.value).join(', ');

          const textareas = form.querySelectorAll('textarea[name="answer"]');
          const structuresOther = textareas.length > 1 ? textareas[0].value.trim() : '';
          const generalTextarea = textareas[textareas.length - 1].value.trim();

          const payload = {
            barkcloth_id: barkcloth.id,
            question: question.text,
            square_shapes: getChecked('square-dropdown'),
            circle_shapes: getChecked('circle-dropdown'),
            triangle_shapes: getChecked('triangle-dropdown'),
            line_shapes: getChecked('lines-dropdown'),
            cross_shapes: crossChecked,
            structures_other: structuresOther,
            textarea: generalTextarea,
          };

          submitBtn.disabled = true;
          submitBtn.textContent = 'Saving…';

          try {
            const res = await fetch('submit_quiz.php', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload),
            });

            const json = await res.json();

            if (!res.ok || json.error) {
              console.error('Submission error:', json.error);
            }
          } catch (err) {
            console.error('Network error:', err);
          }

          showQuiz(data);
        });
    }

    fetch('data/data.csv')
      .then(res => res.text())
      .then(csvText => showQuiz(parseCSV(csvText)))
      .catch(err => console.error("CSV failed to load:", err));
  </script>
</body>

</html>
