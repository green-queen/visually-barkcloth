<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" type="text/css" href="styles/site.css">
  <title>Visually Barkcloth</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body>
  <nav class="nav">
    <ul>
      <li><a href="index.html" class="active">Home</a></li>
      <li><a href="quiz.html">Quiz</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <main class="hero">
    <div class="hero-bg"></div>
    <div id="quiz-container"></div>
    <div id="img-modal"
      style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.7); justify-content:center; align-items:center; z-index:9999; cursor:pointer;">
      <img id="modal-img" src=""
        style="max-width:90vw; max-height:90vh;">
    </div>
  </main>

  <script>
    const QUESTIONS = [
      {
        type: 'multiple',
        text: 'What building blocks do you see?',
        options: ['Cross']
      },
      {
        type: 'text',
        text: 'What pattern rhythm do you see?'
      },
      {
        type: 'text',
        text: 'What is the first thing you think of when you see this textile?'
      },
      {
        type: 'text',
        text: 'What pattern do you see?'
      }
    ];

    function parseCSV(text) {
      const [headerLine, ...rows] = text.trim().split('\n');
      const headers = headerLine.split(',').map(h => h.trim());

      return rows.map(row => {
        const values = row.split(',');
        return Object.fromEntries(
          headers.map((h, i) => [h, values[i]?.trim() ?? ''])
        );
      });
    }

    function pickRandom(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function getImageLink(barkcloth) {
      return `img/${barkcloth.id}.png`;
    }

    function buildAnswerHTML(question) {
      if (question.type === 'multiple') {
        const dropdowns = [
          {
            id: "square-dropdown",
            label: "Select Square",
            options: [
              { value: "square", text: "Square" },
              { value: "rectangle", text: "Rectangle" },
              { value: "rhombus", text: "Rhombus" }
            ]
          },
          {
            id: "circle-dropdown",
            label: "Select Circle",
            options: [
              { value: "circle", text: "Circle" },
              { value: "oval", text: "Oval" },
              { value: "dot", text: "Dot" }
            ]
          },
          {
            id: "triangle-dropdown",
            label: "Select Triangle",
            options: [
              { value: "equilateral", text: "Equilateral" },
              { value: "right", text: "Right" },
              { value: "isosceles", text: "Isosceles" },
              { value: "scalene", text: "Scalene" }
            ]
          },
          {
            id: "lines-dropdown",
            label: "Select Line",
            options: [
              { value: "regular", text: "Regular" },
              { value: "dotted", text: "Dotted" },
              { value: "curved", text: "Curved" }
            ]
          }
        ];

        const dropdownHTML = dropdowns.map(drop =>
          `<div class="dropdown" data-control="checkbox-dropdown" id="${drop.id}">
            <label class="dropdown-label">${drop.label}</label>
            <div class="dropdown-list">
              ${drop.options.map(opt => `
                <label class="dropdown-option">
                  <input type="checkbox" name="dropdown-group" value="${opt.value}" /> ${opt.text}
                </label>
              `).join('')}
            </div>
          </div>`
        ).join('');

        const optionsHTML = question.options.map(opt => `
          <label class="quiz-option">
            <input type="checkbox" name="answer" value="${opt}"> ${opt}
          </label>
        `).join('');

        return dropdownHTML + optionsHTML + `
          <label>
            Other structures you see:
            <textarea class="quiz-textarea"
              name="answer"
              rows="4"
              placeholder="Your answer..."></textarea>
          </label>
        `;
      }

      return `
        <textarea class="quiz-textarea"
          name="answer"
          rows="4"
          placeholder="Your answer..."></textarea>
      `;
    }

    function showQuiz(data) {
      const container = document.getElementById('quiz-container');
      const barkcloth = pickRandom(data);
      const question = pickRandom(QUESTIONS);

      container.innerHTML = `
        <img class="quiz-img" src="${getImageLink(barkcloth)}" alt="${barkcloth.id}">
        <div class="quiz-citation">
          ${barkcloth["reference citation"]}
        </div>
        <form id="quiz-form">
          <div class="quiz-question">${question.text}</div>
          ${buildAnswerHTML(question)}
          <button class="quiz-submit" type="submit">Submit</button>
        </form>
      `;

      const quizImg = container.querySelector('.quiz-img');
      const imgModal = document.getElementById('img-modal');
      const modalImg = document.getElementById('modal-img');

      quizImg.onclick = function () {
        modalImg.src = quizImg.src;
        imgModal.style.display = 'flex';
      };

      imgModal.onclick = function () {
        imgModal.style.display = 'none';
      };

      if (document.querySelector('[data-control="checkbox-dropdown"]')) {
        (function ($) {
          var CheckboxDropdown = function (el) {
            var _this = this;
            this.isOpen = false;
            this.$el = $(el);
            this.$label = this.$el.find('.dropdown-label');
            this.$inputs = this.$el.find('[type="checkbox"]');
            this.$label.on('click', function (e) {
              e.preventDefault();
              _this.toggleOpen();
            });
          };
          CheckboxDropdown.prototype.toggleOpen = function (forceOpen) {
            var _this = this;
            if (!this.isOpen || forceOpen) {
              this.isOpen = true;
              this.$el.addClass('on');
              $(document).on('click', function (e) {
                if (!$(e.target).closest('[data-control]').length) {
                  _this.toggleOpen();
                }
              });
            } else {
              this.isOpen = false;
              this.$el.removeClass('on');
              $(document).off('click');
            }
          };
          var checkboxesDropdowns = document.querySelectorAll('[data-control="checkbox-dropdown"]');
          for (var i = 0, length = checkboxesDropdowns.length; i < length; i++) {
            new CheckboxDropdown(checkboxesDropdowns[i]);
          }
        })(jQuery);
      }

      document.getElementById('quiz-form')
        .addEventListener('submit', (e) => {
          e.preventDefault();
          showQuiz(data);
        });
    }

    fetch('data/data.csv')
      .then(res => res.text())
      .then(csvText => showQuiz(parseCSV(csvText)))
      .catch(err => console.error("CSV failed to load:", err));
  </script>
</body>

</html>
