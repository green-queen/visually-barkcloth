        const structureKeys = [
            "square-structure",
            "square-cross-structure",
            "square-concentric-circle-structure",
            "rectangle-structure",
            "rhombus-structure",
            "equilateral-structure",
            "circle-structure",
            "diag-sym",
            "gen-sym",
            "matrix-sym",
            "two-dir-sym",
            "four-dir-sym",
            "concentric-circle-sym"
        ];

        function parseCSV(csv) {
            const lines = csv.trim().split('\n');
            const header = lines[0].split(',').map(h => h.trim());
            return lines.slice(1).map(line => {
                let fields = [];
                let current = '';
                let inQuotes = false;
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if (char === '"') {
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        fields.push(current.trim());
                        current = '';
                    } else {
                        current += char;
                    }
                }
                fields.push(current.trim());
                const structureValues = {};
                structureKeys.forEach((key) => {
                    const colIdx = header.indexOf(key);
                    structureValues[key] = fields[colIdx] && fields[colIdx].replace(/\s/g, '') === '1';
                });
                return {
                    id: fields[0],
                    origin: fields[1],
                    structures: structureKeys.filter(key => structureValues[key]),
                    link: fields[fields.length - 1]
                };
            });
        }

        const barkcloths = parseCSV(csvData);

        const filterBar = document.getElementById('filter-bar');
        const barkclothList = document.getElementById('barkcloth-list');
        let selectedStructures = [];

        filterBar.addEventListener('click', e => {
            if (e.target.classList.contains('filter-btn')) {
                const structure = e.target.dataset.structure;
                e.target.classList.toggle('selected');
                if (selectedStructures.includes(structure)) {
                    selectedStructures = selectedStructures.filter(s => s !== structure);
                } else {
                    selectedStructures.push(structure);
                }
                renderBarkcloths();
            }
        });

        function renderBarkcloths() {
            if (selectedStructures.length === 0) {
                barkclothList.innerHTML = `
      <div style="grid-column: 1 / -1; text-align: center; color: var(--muted, #888); font-size: 1rem; margin-top: 2rem;">
        Please select a structure filter above.
      </div>
    `;
                return;
            }
            let filtered = barkcloths.filter(bc =>
                selectedStructures.every(structure => bc.structures.includes(structure))
            );
            barkclothList.innerHTML = filtered.length
                ? filtered.map(bc => `
      <div class="barkcloth-card">
        <img src="img/${bc.id}.png" alt="${bc.id}" style="width:100%;border-radius:8px;margin-bottom:1rem;object-fit:cover;">
        <div><strong>${bc.id}</strong></div>
        <div>${bc.origin}</div>
        <div>Structures: ${bc.structures.length ? bc.structures.join(', ') : 'None'}</div>
      </div>
    `).join('')
                : `<div class="no-results">
        No barkcloths match the selected filters.
      </div>`;
        }

        renderBarkcloths();
